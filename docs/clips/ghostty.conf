# The window every guide clip is recorded in (scripts/guide-record.sh loads
# only this, not the user's config). Size in cells comes from each tape,
# unless AeroSpace gives the window a workspace of its own.
# The author's look (TokyoNight, JetBrains Mono Bold), a little larger: the
# clips are scaled down to the guide's column.
theme = TokyoNight
font-family = JetBrains Mono
font-style = Bold
font-size = 14
window-padding-x = 8
window-padding-y = 6
window-padding-balance = true
macos-titlebar-style = hidden
window-position-x = 80
window-position-y = 60
window-save-state = never
confirm-close-surface = false
quit-after-last-window-closed = true
cursor-style-blink = false
mouse-hide-while-typing = false
shell-integration = none
