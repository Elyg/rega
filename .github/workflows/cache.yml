name: cache

# Release builds run on tags, and a tag can only read caches saved on itself or on main,
# so without this every release starts cold. Build the release dependencies on main
# whenever they change, and touch them twice a week: GitHub evicts caches unused for 7 days.
on:
  push:
    branches: [main]
    paths:
      - flake.lock
      - flake.nix
      - nix/**
      - conanfile.py
      - conan-profiles/**
      - .github/workflows/cache.yml
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

jobs:
  linux-static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main, 2026-11-11
      - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main, 2026-11-11
      # Everything `nix build .#static` needs, but not rega itself.
      - run: nix build .#static.inputDerivation -L

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main, 2026-11-11
      # Conan only; the dev shell comes from cache.nixos.org (see release.yml).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.conan2
          key: conan-macos-arm64-${{ hashFiles('conanfile.py', 'conan-profiles/*') }}
      - run: nix develop -c just deps
